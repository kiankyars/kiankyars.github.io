name: Site check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the site
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Build the site
        run: bundle exec jekyll build --strict_front_matter

      - name: Check generated pages and local links
        run: bundle exec ruby scripts/check_site.rb _site
