name: Sync currently reading

on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-currently-reading
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync Goodreads shelf
        run: python3 scripts/sync_currently_reading.py
      - name: Commit a shelf change
        run: |
          if git diff --quiet -- _data/currently_reading.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- _data/currently_reading.json
          git commit -m "Update currently reading"
          git push
