name: Weekly victories

# Manual fallback only. The Sunday schedule runs on Kian's machine with the
# Grok CLI login (skills/weekly-victories/scripts/install_schedule.sh); this
# workflow uses the API backends and needs XAI_API_KEY or X_BEARER_TOKEN.
on:
  workflow_dispatch:
    inputs:
      week:
        description: "Friday the post is dated (YYYY-MM-DD). Default: last completed week."
        required: false

permissions:
  contents: write

concurrency:
  group: weekly-victories
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build post from time-lapses
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          TIMELAPSE_BACKEND: ${{ vars.TIMELAPSE_BACKEND || 'xai' }}
        run: |
          args=()
          if [ -n "${{ inputs.week }}" ]; then args+=(--week "${{ inputs.week }}"); fi
          python3 skills/weekly-victories/scripts/build_weekly_victories.py "${args[@]}"
      - name: Commit the post
        run: |
          if git status --porcelain -- _posts/weekly-victories | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- _posts/weekly-victories
            git commit -m "Add weekly victories from time-lapses"
            git push
          fi
