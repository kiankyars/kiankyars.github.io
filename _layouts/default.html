<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171917" media="(prefers-color-scheme: dark)" />
    {% seo %}
    <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | absolute_url }}" />
    <link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}" />
    {% if page.math %}
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [
            ["$", "$"],
            ["\\(", "\\)"],
          ],
          displayMath: [
            ["\\[", "\\]"],
            ["$$", "$$"],
          ],
          processEscapes: true,
        },
        svg: {
          fontCache: "global",
        },
      };
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
    {% endif %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>

    <header class="site-header">
      <a class="site-title" href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Kian Kyars</a>

      <nav class="primary-nav" aria-label="Primary navigation">
        <a href="{{ '/blog/' | relative_url }}"{% if page.url == '/blog/' or page.path contains '_posts/blog/' %} aria-current="page"{% endif %}>Writing</a>
        <a href="{{ '/build/' | relative_url }}"{% if page.url == '/build/' %} aria-current="page"{% endif %}>Build</a>
        <a href="{{ '/publications/' | relative_url }}"{% if page.url == '/publications/' %} aria-current="page"{% endif %}>Publications</a>
        <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' %} aria-current="page"{% endif %}>About</a>
        <a href="{{ '/now/' | relative_url }}"{% if page.url == '/now/' %} aria-current="page"{% endif %}>Now</a>
      </nav>
    </header>

    <main id="main-content">
      {% unless page.hide_title or page.layout == "post" %}
      <header class="page-header">
        <h1>{{ page.title }}</h1>
      </header>
      {% endunless %}

      {{ content }}
    </main>

    <footer class="site-footer">
      <small>&copy; {{ "now" | date: "%Y" }} Kian Kyars</small>
      <nav class="footer-nav" aria-label="More links">
        <a href="{{ '/awards/' | relative_url }}">Awards</a>
        <a href="{{ '/weekly-victories/' | relative_url }}">Weekly victories</a>
        <a href="{{ '/doomscrolling/' | relative_url }}">Doomscrolling</a>
        <a href="{{ '/CV.pdf' | relative_url }}">CV</a>
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
      </nav>
    </footer>
  </body>
</html>
